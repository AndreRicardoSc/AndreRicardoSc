name: Update Contributions Graph

# Gatilhos:
#   - schedule         : toda segunda-feira às 06:00 UTC (03:00 em Santa Catarina)
#   - workflow_dispatch: execução manual pela aba Actions
#   - push             : roda quando este workflow muda, para validar a alteração
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-contributions.yml"
      - "scripts/generate_contributions.py"

# Permissões mínimas: leitura para buscar os dados, escrita apenas para o commit automático.
# Usa o GITHUB_TOKEN nativo — nenhum Personal Access Token é necessário.
permissions:
  contents: write

# Evita execuções concorrentes gerando commits duplicados.
concurrency:
  group: update-contributions
  cancel-in-progress: true

jobs:
  update-graph:
    name: Gerar assets/contributions.svg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O script usa apenas a biblioteca padrão do Python (urllib), sem dependências externas.
      - name: Gerar gráfico de contribuições
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contributions.py

      - name: Commit e push somente se o SVG mudou
        run: |
          set -euo pipefail
          if [ ! -f assets/contributions.svg ]; then
            echo "::error::assets/contributions.svg não foi gerado."
            exit 1
          fi
          if git diff --quiet -- assets/contributions.svg; then
            echo "::notice::Sem alterações no gráfico. Nada a fazer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "chore: atualizar gráfico de contribuições [skip ci]"
          git push
